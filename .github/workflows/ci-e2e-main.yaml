name: CI E2E Main

on:
  push:
    branches: [main]

  pull_request:
    types: [labeled, synchronize, opened, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e-test:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-merge-queue'))
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--max-old-space-size=10240"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*

      - name: Install dependencies
        uses: ./.github/actions/yarn-install

      - name: Restore Nx build cache
        uses: actions/cache/restore@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0 (restore)
        with:
          key: v4-e2e-build-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            v4-e2e-build-${{ github.ref_name }}-
            v4-e2e-build-main-
          path: |
            .nx
            node_modules/.cache
            packages/*/node_modules/.cache

      - name: Build beeax-shared
        run: npx nx build beeax-shared

      - name: Install Playwright Browsers
        run: npx nx setup beeax-e2e-testing

      - name: Setup environment files
        run: |
          cp packages/beeax-front/.env.example packages/beeax-front/.env
          npx nx reset:env:e2e-testing-server beeax-server

      - name: Build frontend
        run: NODE_ENV=production npx nx build beeax-front

      - name: Build server
        run: npx nx build beeax-server

      - name: Save Nx build cache
        if: always()
        uses: actions/cache/save@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0 (save)
        with:
          key: v4-e2e-build-${{ github.ref_name }}-${{ github.sha }}
          path: |
            .nx
            node_modules/.cache
            packages/*/node_modules/.cache

      - name: Create and setup database
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c 'CREATE DATABASE "default";'
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c 'CREATE DATABASE "test";'
          npx nx run beeax-server:database:reset

      - name: Start server
        run: |
          npx nx start beeax-server &
          echo "Waiting for server to be ready..."
          timeout 60 bash -c 'until curl -s http://localhost:3000/health; do sleep 2; done'

      - name: Start frontend
        run: |
          npm_config_yes=true npx serve -s packages/beeax-front/build -l 3001 &
          echo "Waiting for frontend to be ready..."
          timeout 60 bash -c 'until curl -s http://localhost:3001; do sleep 2; done'

      - name: Start worker
        run: |
          npx nx run beeax-server:worker &
          echo "Worker started"

      - name: Run Playwright tests
        run: npx nx test beeax-e2e-testing

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-results
          path: |
            packages/beeax-e2e-testing/run_results/
            packages/beeax-e2e-testing/test-results/
          retention-days: 7

  ci-e2e-main-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [e2e-test]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure')
        run: exit 1

  notify-main-ci-failure:
    if: always() && github.event_name == 'push' && contains(needs.*.result, 'failure')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [e2e-test]
    steps:
      - name: Ping engineering on main CI failure
        run: |
          curl -fsS -X POST https://engineering.beeax.com/s/main-ci-failing \
            -H 'Content-Type: application/json' \
            -d '{
              "commit": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
