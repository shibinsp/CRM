name: CI UI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        package.json
        yarn.lock
        packages/beeax-ui/**
        packages/beeax-shared/**
  ui-task:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [lint, typecheck, test, size, pack-size]
    steps:
      - name: Fetch custom Github Actions and base branch history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 10
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Run ${{ matrix.task }}
        run: npx nx ${{ matrix.task }} beeax-ui
  ui-sb-build:
    needs: changed-files-check
    if: >-
      always() &&
      (github.event_name == 'push' ||
      needs.changed-files-check.outputs.any_changed == 'true')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Fetch custom Github Actions and base branch history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 10
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Build storybook
        run: npx nx storybook:build beeax-ui
      - name: Upload storybook build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: storybook-beeax-ui
          path: packages/beeax-ui/storybook-static
          retention-days: 1
  ui-sb-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: ui-sb-build
    if: always() && needs.ui-sb-build.result == 'success'
    steps:
      - name: Fetch custom Github Actions and base branch history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 10
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Build dependencies
        run: npx nx build beeax-shared
      - name: Download storybook build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: storybook-beeax-ui
          path: packages/beeax-ui/storybook-static
      - name: Install Playwright
        run: |
          cd packages/beeax-ui
          npx playwright install
      - name: Run storybook tests
        run: npx nx storybook:test beeax-ui
      - name: Upload screenshots for visual regression
        if: always() && !cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: argos-screenshots-beeax-ui
          path: packages/beeax-ui/screenshots
          retention-days: 1
  ci-ui-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changed-files-check, ui-task, ui-sb-build, ui-sb-test]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
